name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ios:
    name: iOS — lint, format, test
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint & SwiftFormat
        run: brew install swiftlint swiftformat xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: SwiftLint
        run: swiftlint --strict
      - name: SwiftFormat (check only)
        run: swiftformat --lint .
      - name: Select an available iOS Simulator
        # A hardcoded device name (e.g. "iPhone 16") isn't reliable across
        # runner images — GitHub's macOS runners don't always have that
        # exact simulator provisioned (confirmed failure, 2026-09-11: CI
        # run #3, "Unable to find a device matching... name:iPhone 16",
        # only placeholder "Any iOS Simulator Device" listed as available).
        # Discover whatever iPhone simulator actually exists instead.
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d["isAvailable"] and "iPhone" in d["name"]:
                      print(d["udid"])
                      sys.exit(0)
          ')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build + test
        run: |
          xcodebuild -scheme Laju -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" test

  backend:
    name: Backend — lint, test
    runs-on: ubuntu-latest
    if: false # activates once T2.1 creates backend/package.json — not yet, Fase 2 not built
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm test
