name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ios:
    name: iOS — lint, format, test
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint & SwiftFormat
        run: brew install swiftlint swiftformat xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: SwiftLint
        run: swiftlint --strict
      - name: SwiftFormat (check only)
        run: swiftformat --lint .
      - name: Build + test
        run: |
          xcodebuild -scheme Laju -destination 'platform=iOS Simulator,name=iPhone 16' test

  backend:
    name: Backend — lint, test
    runs-on: ubuntu-latest
    if: false # activates once T2.1 creates backend/package.json — not yet, Fase 2 not built
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm test
